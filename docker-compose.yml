version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: classroom-ai-postgres
    environment:
      POSTGRES_USER: classroom_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: classroom_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: classroom-ai-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  backend:
    build: ./backend
    container_name: classroom-ai-backend
    environment:
      DATABASE_URL: postgresql://classroom_user:password123@postgres:5432/classroom_ai
      REDIS_URL: redis://redis:6379/0
      GPU_DEVICE: "0"
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: classroom-ai-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
